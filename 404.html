<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — TRACKSAN</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0A1628">
<style>
  .notfound{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 24px; }
  .notfound .code{ font-family:var(--font-mono); color:var(--gold); font-size:0.9rem; letter-spacing:0.1em; margin-bottom:22px; }
  .notfound h1{ font-family:var(--font-display); font-size:clamp(2rem,5vw,3rem); font-weight:600; margin-bottom:18px; }
  .notfound p{ color:var(--text-dim); max-width:46ch; margin-bottom:36px; }
  .notfound .links{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<main id="main">
  <div class="notfound">
    <span class="code">404</span>
    <h1>This page doesn't exist.</h1>
    <p>The page you're looking for may have moved or the link may be out of date. Here are a couple of places to go instead.</p>
    <div class="links">
      <a class="btn btn-primary" href="/">Home</a>
      <a class="btn btn-ghost" href="/#contact">Contact</a>
    </div>
  </div>
</main>
</body>
</html>
